<!-- reset_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>MD57 Car Wash - Reset Password</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/md57logo.jpg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <!-- First-load loader (once per browser session - see the MOTION
         section of core.css). -->
    <div class="app-loader" aria-hidden="true">
        <div class="loader-ring"><img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt=""></div>
        <p>MD57 Car Wash</p>
    </div>
    <nav class="top-navbar">
        <a href="/login" class="nav-brand">
            <img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt="MD57 Logo">
            <span>MD57 Car Wash &amp; Auto Detailing</span>
        </a>
        <div class="nav-menu">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="toggle-knob"><i class="fa-solid fa-moon" id="themeToggleIcon"></i></span>
            </button>
        </div>
    </nav>
    <div class="main-container">
        <div class="login-card">
            <img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt="MD57 Logo">

            <h2>Enter Reset Code</h2>
            <p class="subtitle sentence">We sent a 6-digit code to the email on file for <strong>{{ username }}</strong>. Enter it below along with your new password.</p>

            <form method="POST" action="/reset-password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="username" value="{{ username }}"/>
                <div class="form-group">
                    <label>6-Digit Code</label>
                    <input type="text" name="otp" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" placeholder="8 to 16 characters" minlength="{{ password_min }}" maxlength="{{ password_max }}" pattern="{{ password_pattern }}" title="{{ password_hint }}" aria-describedby="passwordHint" required autocomplete="new-password">
                    <p id="passwordHint">{{ password_hint }}</p>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" placeholder="Re-enter new password" minlength="{{ password_min }}" maxlength="{{ password_max }}" pattern="{{ password_pattern }}" title="{{ password_hint }}" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>

            {% if error %}
            <div class="error"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
            {% endif %}

            <div class="nav-links">
                <a href="/forgot-password">Didn't get a code? Request another</a>
            </div>
            <div class="nav-links">
                <a href="/login">&larr; Back to Sign In</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
