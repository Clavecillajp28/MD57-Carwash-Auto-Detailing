<!-- forgot_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>MD57 Car Wash - Forgot Password</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/md57logo.jpg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <!-- First-load loader (once per browser session - see the MOTION
         section of core.css). -->
    <div class="app-loader" aria-hidden="true">
        <div class="loader-ring"><img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt=""></div>
        <p>MD57 Car Wash</p>
    </div>
    <nav class="top-navbar">
        <a href="/login" class="nav-brand">
            <img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt="MD57 Logo">
            <span>MD57 Car Wash &amp; Auto Detailing</span>
        </a>
        <div class="nav-menu">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="toggle-knob"><i class="fa-solid fa-moon" id="themeToggleIcon"></i></span>
            </button>
        </div>
    </nav>
    <div class="main-container">
        <div class="login-card">
            <img src="{{ url_for('static', filename='images/md57logo.jpg') }}" alt="MD57 Logo">
            <h2>Forgot Password</h2>
            <p class="subtitle sentence">Enter your account's username or email and we'll send a 6-digit code to reset your password.</p>

            <form method="POST" action="/forgot-password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-group">
                    <label>Email Address / Username</label>
                    <input type="text" name="username" placeholder="Enter email or username" required autocomplete="username">
                </div>
                <button type="submit" class="btn-primary">Send Reset Code</button>
            </form>

            <div class="nav-links">
                <a href="/login">&larr; Back to Sign In</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
